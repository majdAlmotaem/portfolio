<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Content Manager | Custom CMS</title>
  
  <!-- Custom Admin Dashboard Styles -->
  <link rel="stylesheet" href="css/admin.css" />
  
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Yaml & Markdown Parsers (CDM) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- ─── Toast System Notifications ─── -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ─── Login Screen Overlay ─── -->
  <div id="login-screen" class="login-overlay hidden">
    <div class="login-card">
      <div class="login-logo">CMS <i class="fa-solid fa-laptop-code"></i></div>
      <div class="login-subtitle">Portfolio Content Manager</div>
      
      <div class="login-actions" style="margin: 2rem 0 1.5rem 0;">
        <button id="btn-github-login" class="btn btn-primary" style="width: 100%; padding: 0.9rem 1.5rem; display: flex; align-items: center; justify-content: center; gap: 0.75rem; font-size: 1rem;">
          <i class="fa-brands fa-github" style="font-size: 1.3rem;"></i> Login with GitHub
        </button>
      </div>

      <div class="login-footer-notice" style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">
        <i class="fa-solid fa-shield-halved"></i> Authorized admin access only
      </div>
    </div>
  </div>

  <!-- ─── Dashboard Main Interface ─── -->
  <div id="admin-container" class="admin-container hidden">
    
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        Admin <i class="fa-solid fa-laptop-code" style="color:var(--text-muted); font-size:1.1rem;"></i>
        <span>V2</span>
      </div>
      
      <ul class="sidebar-menu">
        <li class="menu-item active" data-tab="profile">
          <button type="button"><i class="fa-solid fa-user-gear"></i> Profile & Hero</button>
        </li>
        <li class="menu-item" data-tab="projects">
          <button type="button"><i class="fa-solid fa-diagram-project"></i> Projects CRUD</button>
        </li>
        <li class="menu-item" data-tab="skills">
          <button type="button"><i class="fa-solid fa-code"></i> Tech & Skills</button>
        </li>
        <li class="menu-item" data-tab="certs">
          <button type="button"><i class="fa-solid fa-award"></i> Certificates</button>
        </li>
        <li class="menu-item" data-tab="blogs">
          <button type="button"><i class="fa-solid fa-newspaper"></i> Blog Posts</button>
        </li>
      </ul>
      
      <div class="sidebar-footer">
        <div id="user-footer-meta" style="margin-bottom: 1rem;"></div>
        <button type="button" class="btn btn-danger btn-sm" id="btn-logout" style="width: 100%;">
          <i class="fa-solid fa-right-from-bracket"></i> Disconnect
        </button>
      </div>
    </aside>

    <!-- Workspace Main Panel -->
    <main class="admin-content">
      <div id="workspace-container">
        <!-- Dashboard sub-modules content loaded here -->
      </div>
    </main>

  </div>

  <!-- Main JS ES6 Orchestrator -->
  <script type="module" src="js/admin-app.js"></script>
</body>
</html>
